<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilustraciones - Shumi</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1F2937;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .logo-container {
            margin-right: 10px;
        }
        .logo-container img {
            max-height: 120px;
        }
        nav {
            background-color: #1c1c1c;
            padding: 1rem 2rem;
            display: inline-block;
            border-radius: 8px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* Galería de imágenes en filas de 3 */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .gallery-item {
            position: relative;
        }
        .gallery-item img {
            border-radius: 8px;
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
        }

        /* Lightbox modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .lightbox img {
            margin: auto;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox:target {
            display: block;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Encabezado con logo y navegación -->
    <div class="header-container">
        <div class="logo-container">
            <img src="images/Logo Shumi PNG.png" alt="Shumi Logo"> <!-- Reemplaza con la URL de tu logo -->
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="ilustraciones.html">Ilustraciones</a>
            <a href="novedades.html">Novedades</a>
            <a href="acerca-de.html">Acerca de</a>
        </nav>
    </div>

    <!-- Galería de imágenes en formato de cuadrícula -->
    <div class="gallery-container">
        <!-- Ejemplo de imagen 1 -->
        <div class="gallery-item">
            <a href="#img1">
                <img src="images/Ilustración152.jpg" alt="Ilustración 1">
            </a>
        </div>
        <!-- Ejemplo de imagen 2 -->
        <div class="gallery-item">
            <a href="#img2">
                <img src="images/Zilla Ult2.png" alt="Ilustración 2">
            </a>
        </div>
        <!-- Ejemplo de imagen 3 -->
        <div class="gallery-item">
            <a href="#img3">
                <img src="images/Ilustración152.jpg" alt="Ilustración 3">
            </a>
        </div>
        <!-- Ejemplo de imagen 4 -->
        <div class="gallery-item">
            <a href="#img4">
                <img src="images/Zilla Ult2.png" alt="Ilustración 4">
            </a>
        </div>
        <!-- Ejemplo de imagen 5 -->
        <div class="gallery-item">
            <a href="#img5">
                <img src="images/Ilustración152.jpg" alt="Ilustración 5">
            </a>
        </div>
        <!-- Ejemplo de imagen 6 -->
        <div class="gallery-item">
            <a href="#img6">
                <img src="images/Zilla Ult2.png" alt="Ilustración 6">
            </a>
        </div>
        <!-- Más imágenes... -->
    </div>

    <!-- Lightbox modal de las imágenes -->
    <div class="lightbox" id="img1">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Ilustración152.jpg" alt="Ilustración 1 en grande">
    </div>

    <div class="lightbox" id="img2">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Zilla Ult2.png" alt="Ilustración 2 en grande">
    </div>

    <div class="lightbox" id="img3">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Ilustración152.jpg" alt="Ilustración 3 en grande">
    </div>

    <!-- Más modales de Lightbox si es necesario... -->

</body>
</html>
