<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilustraciones - Shumi</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Aplicar box-sizing a todos los elementos para evitar desbordamientos por padding y border */
        * {
            box-sizing: border-box;
        }

        /* Prevenir el desplazamiento horizontal */
        html, body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1F2937;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
            transition: background-color 0.3s, color 0.3s; /* Transición para modo claro/oscuro */
        }
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .logo-container {
            margin-right: 10px;
        }
        .logo-container img {
            max-height: 120px;
        }
        nav {
            background-color: #1c1c1c;
            padding: 1rem 2rem;
            display: inline-block;
            border-radius: 8px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            position: relative;
            transition: color 0.3s;
        }
        /* Animación de subrayado */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            background-color: white;
            left: 50%;
            bottom: -5px;
            transition: width 0.3s ease, left 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
            left: 0;
        }

        /* Galería de imágenes en filas de 3 */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .gallery-item {
            position: relative;
        }
        .gallery-item img {
            border-radius: 8px;
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
        }

        /* Lightbox modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .lightbox img {
            margin: auto;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox:target {
            display: block;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Modo claro */
        body.light-mode {
            background-color: #f0f0f0;
            color: #333;
        }
        body.light-mode nav {
            background-color: #f0f0f0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        body.light-mode nav a {
            color: #333;
        }
        body.light-mode nav a::after {
            background-color: #333;
        }
        body.light-mode .gallery-container img {
            border-color: #333;
        }
        body.light-mode .toggle-btn {
            background-color: #333;
            color: white;
        }

        footer {
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            padding: 1rem;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        /* Botón para alternar entre modo oscuro y modo claro */
        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .toggle-btn:hover {
            background-color: #0a74c7;
        }

        body.light-mode .toggle-btn {
            background-color: #333;
            color: white;
        }

        body.light-mode .toggle-btn:hover {
            background-color: #555;
        }

    </style>
</head>
<body>
    <!-- Botón para alternar entre modo oscuro y modo claro -->
    <button class="toggle-btn" id="toggle-theme-btn">Modo Claro</button>

    <!-- Encabezado con logo y navegación -->
    <div class="header-container">
        <div class="logo-container">
            <img src="images/Logo Shumi PNG.png" alt="Shumi Logo"> <!-- Reemplaza con la URL de tu logo -->
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="ilustraciones.html">Ilustraciones</a>
            <a href="novedades.html">Novedades</a>
            <a href="acerca-de.html">Acerca de</a>
        </nav>
    </div>

    <!-- Galería de imágenes en formato de cuadrícula -->
    <div class="gallery-container">
        <div class="gallery-item">
            <a href="#img1">
                <img src="images/Ilustración152.jpg" alt="Ilustración 1">
            </a>
        </div>
        <div class="gallery-item">
            <a href="#img2">
                <img src="images/Zilla Ult2.png" alt="Ilustración 2">
            </a>
        </div>
        <div class="gallery-item">
            <a href="#img3">
                <img src="images/Ilustración152.jpg" alt="Ilustración 3">
            </a>
        </div>
        <div class="gallery-item">
            <a href="#img4">
                <img src="images/Ilustración152.jpg" alt="Ilustración 4">
            </a>
        </div>
    </div>

    <!-- Lightbox modal de las imágenes -->
    <div class="lightbox" id="img1" onclick="closeLightbox(event)">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Ilustración152.jpg" alt="Ilustración 1 en grande">
    </div>

    <div class="lightbox" id="img2" onclick="closeLightbox(event)">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Zilla Ult2.png" alt="Ilustración 2 en grande">
    </div>

    <div class="lightbox" id="img3" onclick="closeLightbox(event)">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Ilustración152.jpg" alt="Ilustración 3 en grande">
    </div>

    <div class="lightbox" id="img4" onclick="closeLightbox(event)">
        <a href="#" class="close-btn">&times;</a>
        <img src="images/Ilustración152.jpg" alt="Ilustración 4 en grande">
    </div>

    <footer>
        &copy; 2023 Shumi. Todos los derechos reservados.
    </footer>

    <script>
        // Función para alternar entre modo oscuro y modo claro
        const toggleBtn = document.getElementById('toggle-theme-btn');
        toggleBtn.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            toggleBtn.textContent = document.body.classList.contains('light-mode') ? 'Modo Oscuro' : 'Modo Claro';
        });

        // Función para cerrar el lightbox al hacer clic fuera de la imagen
        function closeLightbox(event) {
            if (event.target.tagName !== 'IMG') {
                window.location.hash = '';
            }
        }
    </script>
</body>
</html>
