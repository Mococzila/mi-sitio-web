<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1F2937;
            color: white;
            text-align: center;
            transition: background-color 0.3s, color 0.3s; /* Transición para modo claro/oscuro */
        }

        /* Estilos del contenedor del encabezado */
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        /* Contenedor del logo */
        .logo-container {
            margin-right: 10px;
        }

        .logo-container img {
            max-height: 120px; /* Ajusta la altura del logo */
        }

        /* Estilos del menú de navegación */
        nav {
            background-color: #1c1c1c;
            padding: 1rem 2rem;
            display: inline-block;
            border-radius: 8px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s;
        }

        /* Animación en hover para los botones del menú */
        nav a:hover {
            color: #1da1f2; /* Cambia el color del texto al hacer hover */
        }

        /* Barra animada bajo los botones al hacer hover */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            background-color: #1da1f2;
            left: 0;
            bottom: 0;
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Contenedor de novedades */
        .novedades-container {
            background-color: #2D3748; /* Fondo del contenedor */
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 50px auto;
            transition: background-color 0.3s;
        }

        h2 {
            color: #fff;
            text-align: center;
        }

        .novedad {
            background-color: #2e2e2e;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .novedad-header {
            display: flex;
            align-items: center;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .username {
            font-weight: bold;
            margin: 0;
        }

        .fecha {
            font-size: 12px;
            color: #999;
            margin: 0;
        }

        .novedad-content {
            margin-top: 10px;
        }

        .novedad-content a {
            color: #1da1f2;
            text-decoration: none;
        }

        .novedad-content a:hover {
            text-decoration: underline;
        }

        /* Botón para alternar entre modo oscuro y modo claro */
        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .toggle-btn:hover {
            background-color: #0a74c7;
        }

        /* Modo claro */
        body.light-mode {
            background-color: #f0f0f0;
            color: #333;
        }

        body.light-mode nav {
            background-color: #fff;
        }

        body.light-mode nav a {
            color: #333;
        }

        body.light-mode .novedades-container {
            background-color: #e2e8f0;
        }

        body.light-mode .novedad {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .toggle-btn {
            background-color: #333;
            color: white;
        }

        body.light-mode .toggle-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <!-- Botón para alternar entre modo oscuro y modo claro -->
    <button class="toggle-btn" id="toggle-theme-btn">Modo Claro</button>

    <!-- Encabezado con el logo y el menú de navegación -->
    <div class="header-container">
        <div class="logo-container">
            <img src="images/Logo Shumi PNG.png" alt="Shumi Logo"> <!-- Reemplaza con la URL de tu logo -->
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="ilustraciones.html">Ilustraciones</a>
            <a href="novedades.html">Novedades</a>
            <a href="acerca-de.html">Acerca de</a>
        </nav>
    </div>

    <!-- Contenedor de novedades -->
    <div class="novedades-container">
        <h2>Novedades</h2>

        <!-- Ejemplo de novedades -->
        <div class="novedad">
            <div class="novedad-header">
                <img src="images/Ilustración152.jpg" alt="Avatar" class="avatar"> <!-- Reemplaza con la URL del avatar -->
                <div>
                    <p class="username">Mococzila</p>
                    <p class="fecha">3 jul. 2016</p>
                </div>
            </div>
            <div class="novedad-content">
                <p>Duo bot invencible con saave/League of Legends <a href="aqui va un enlace" target="_blank">youtub.be/V07a1n7F4oU</a></p>
            </div>
        </div>

        <!-- Repite el bloque anterior para más novedades... -->

    </div>

    <script>
        // Función para alternar entre modo oscuro y modo claro
        const toggleBtn = document.getElementById('toggle-theme-btn');
        toggleBtn.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                toggleBtn.textContent = 'Modo Oscuro';
            } else {
                toggleBtn.textContent = 'Modo Claro';
            }
        });
    </script>

</body>
</html>
